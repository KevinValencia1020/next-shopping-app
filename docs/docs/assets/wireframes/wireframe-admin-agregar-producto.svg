<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="850" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER ADMIN -->
  <rect x="0" y="0" width="1200" height="55" fill="#2c3e50"/>
  <text x="25" y="34" fill="white" font-size="15" font-weight="bold">NEXT SHOPPING - Panel Admin</text>
  <text x="1080" y="34" fill="white" font-size="10">Admin: Carlos R.</text>
  <text x="1150" y="34" fill="white" font-size="10">&#9660;</text>

  <!-- SIDEBAR ADMIN (fijo) -->
  <rect x="0" y="55" width="210" height="795" fill="#34495e"/>
  <text x="20" y="90" font-size="10" fill="#95a5a6" font-weight="bold">GESTION</text>

  <rect x="10" y="105" width="190" height="36" rx="4" fill="#4a90e2"/>
  <text x="25" y="128" font-size="11" fill="white" font-weight="bold">&#128230; Productos</text>

  <text x="25" y="170" font-size="11" fill="#ecf0f1">&#127991; Ofertas</text>
  <text x="25" y="210" font-size="11" fill="#ecf0f1">&#128230; Pedidos</text>

  <line x1="20" y1="240" x2="190" y2="240" stroke="#4a5f73"/>
  <text x="25" y="270" font-size="10" fill="#95a5a6">&#9881; Cerrar sesion</text>

  <!-- CONTENIDO: FORMULARIO -->
  <text x="235" y="95" font-size="20" fill="#333" font-weight="bold">Agregar nuevo producto</text>
  <text x="235" y="118" font-size="10" fill="#999">Productos &#8250; Nuevo</text>

  <!-- Columna izquierda: datos del producto -->
  <text x="235" y="160" font-size="12" fill="#333" font-weight="bold">Nombre del producto *</text>
  <rect x="235" y="168" width="450" height="34" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="190" font-size="10" fill="#bbb">Ej: Microondas Whirlpool 20L</text>

  <text x="235" y="225" font-size="12" fill="#333" font-weight="bold">Descripcion *</text>
  <rect x="235" y="233" width="450" height="70" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="253" font-size="10" fill="#bbb">Descripcion detallada del producto...</text>

  <text x="235" y="325" font-size="12" fill="#333" font-weight="bold">Categoria *</text>
  <rect x="235" y="333" width="215" height="34" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="355" font-size="10" fill="#999">Seleccionar... &#9662;</text>

  <text x="470" y="325" font-size="12" fill="#333" font-weight="bold">Marca *</text>
  <rect x="470" y="333" width="215" height="34" rx="4" fill="white" stroke="#ddd"/>
  <text x="480" y="355" font-size="10" fill="#bbb">Ej: Whirlpool</text>

  <text x="235" y="390" font-size="12" fill="#333" font-weight="bold">Precio *</text>
  <rect x="235" y="398" width="215" height="34" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="420" font-size="10" fill="#bbb">$0</text>

  <text x="470" y="390" font-size="12" fill="#333" font-weight="bold">Stock inicial *</text>
  <rect x="470" y="398" width="215" height="34" rx="4" fill="white" stroke="#ddd"/>
  <text x="480" y="420" font-size="10" fill="#bbb">0 unidades</text>

  <text x="235" y="455" font-size="12" fill="#333" font-weight="bold">Caracteristicas / especificaciones</text>
  <rect x="235" y="463" width="450" height="90" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="483" font-size="10" fill="#bbb">Capacidad: 20L</text>
  <text x="245" y="500" font-size="10" fill="#bbb">Potencia: 700W</text>
  <rect x="245" y="513" width="90" height="22" rx="4" fill="#eef4fc" stroke="#4a90e2"/>
  <text x="253" y="528" font-size="9" fill="#4a90e2">+ Agregar campo</text>

  <!-- Columna derecha: imagenes -->
  <text x="720" y="160" font-size="12" fill="#333" font-weight="bold">Imagenes del producto *</text>
  <rect x="720" y="168" width="235" height="180" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-dasharray="4,4"/>
  <text x="790" y="255" font-size="24" fill="#ccc">+</text>
  <text x="760" y="280" font-size="9" fill="#999">Arrastra imagenes o haz clic</text>
  <text x="775" y="295" font-size="8" fill="#bbb">para subir (min. 1 imagen)</text>

  <rect x="720" y="360" width="55" height="55" fill="#e0e0e0" stroke="#4a90e2" stroke-width="2"/>
  <text x="785" y="392" font-size="8" fill="#4a90e2">Principal</text>
  <rect x="850" y="360" width="55" height="55" fill="#e0e0e0" stroke="#ddd"/>
  <rect x="720" y="425" width="55" height="55" fill="#e0e0e0" stroke="#ddd"/>

  <!-- Nota validacion -->
  <rect x="720" y="500" width="235" height="70" rx="6" fill="#fdf2f2" stroke="#f8cecc" stroke-dasharray="3,3"/>
  <text x="735" y="520" font-size="8" fill="#b85450" font-weight="bold">Validacion:</text>
  <text x="735" y="535" font-size="8" fill="#b85450">No se publica si falta algun campo</text>
  <text x="735" y="548" font-size="8" fill="#b85450">obligatorio (*) o imagen</text>

  <!-- BOTONES DE ACCION -->
  <rect x="235" y="600" width="150" height="42" rx="6" fill="white" stroke="#999"/>
  <text x="280" y="626" font-size="11" fill="#666">Cancelar</text>

  <rect x="400" y="600" width="180" height="42" rx="6" fill="#4a90e2"/>
  <text x="435" y="626" font-size="11" fill="white" font-weight="bold">Publicar producto</text>

</svg>
