<svg viewBox="0 0 375 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="375" height="900" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER (fijo) -->
  <rect x="0" y="0" width="375" height="70" fill="#4a90e2"/>
  <text x="15" y="40" fill="white" font-size="16" font-weight="bold">NEXT SHOPPING</text>
  <rect x="150" y="20" width="200" height="32" rx="16" fill="white"/>
  <text x="165" y="41" fill="#999" font-size="13">Buscar...</text>
  <circle cx="335" cy="36" r="10" fill="none" stroke="#4a90e2" stroke-width="2"/>

  <!-- CATEGORIAS (chips horizontales) -->
  <text x="15" y="95" font-size="11" fill="#333" font-weight="bold">CATEGORIAS</text>
  <rect x="15" y="105" width="70" height="28" rx="14" fill="#e8e8e8"/>
  <text x="25" y="123" font-size="10" fill="#333">Neveras</text>
  <rect x="95" y="105" width="70" height="28" rx="14" fill="#e8e8e8"/>
  <text x="105" y="123" font-size="10" fill="#333">Lavadoras</text>
  <rect x="175" y="105" width="70" height="28" rx="14" fill="#e8e8e8"/>
  <text x="185" y="123" font-size="10" fill="#333">Cocinas</text>
  <rect x="255" y="105" width="70" height="28" rx="14" fill="#e8e8e8"/>
  <text x="265" y="123" font-size="10" fill="#333">+ Ver todo</text>

  <!-- FAVORITOS (carrusel horizontal) -->
  <text x="15" y="165" font-size="12" fill="#333" font-weight="bold">TUS FAVORITOS</text>
  <text x="15" y="178" font-size="8" fill="#999">Desliza para ver mas &#8594;</text>

  <rect x="15" y="185" width="105" height="130" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="23" y="193" width="89" height="70" fill="#e0e0e0"/>
  <text x="23" y="278" font-size="9" fill="#333">Lavadora LG 18kg</text>
  <text x="23" y="293" font-size="10" fill="#4a90e2" font-weight="bold">$1.899.000</text>

  <rect x="128" y="185" width="105" height="130" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="136" y="193" width="89" height="70" fill="#e0e0e0"/>
  <text x="136" y="278" font-size="9" fill="#333">Nevera Samsung</text>
  <text x="136" y="293" font-size="10" fill="#4a90e2" font-weight="bold">$2.450.000</text>

  <!-- tarjeta parcialmente cortada = indica scroll -->
  <rect x="241" y="185" width="105" height="130" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="249" y="193" width="89" height="70" fill="#e0e0e0"/>
  <text x="249" y="278" font-size="9" fill="#333">Microondas LG</text>
  <text x="249" y="293" font-size="10" fill="#4a90e2" font-weight="bold">$410.000</text>

  <rect x="354" y="185" width="30" height="130" rx="6" fill="#f5f5f5" stroke="#ddd" opacity="0.5"/>

  <!-- indicador de scroll (dots) -->
  <circle cx="175" cy="325" r="3" fill="#4a90e2"/>
  <circle cx="185" cy="325" r="3" fill="#ccc"/>
  <circle cx="195" cy="325" r="3" fill="#ccc"/>

  <!-- FEED PERSONALIZADO -->
  <text x="15" y="355" font-size="12" fill="#333" font-weight="bold">PARA TI</text>
  <text x="15" y="368" font-size="9" fill="#999">Basado en tus busquedas recientes</text>
  <text x="15" y="380" font-size="7" fill="#bbb" font-style="italic">(si no hay sesion/historial: se muestra feed por categorias destacadas)</text>

  <!-- tarjeta producto 1 -->
  <rect x="15" y="390" width="345" height="100" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="25" y="400" width="80" height="80" fill="#e0e0e0"/>
  <text x="115" y="415" font-size="11" fill="#333" font-weight="bold">Microondas Whirlpool 20L</text>
  <text x="115" y="432" font-size="9" fill="#666">Panel digital, 700W</text>
  <text x="115" y="450" font-size="12" fill="#4a90e2" font-weight="bold">$389.000</text>
  <rect x="115" y="458" width="90" height="24" rx="4" fill="#4a90e2"/>
  <text x="130" y="474" font-size="9" fill="white">+ Carrito</text>

  <!-- tarjeta producto 2 -->
  <rect x="15" y="500" width="345" height="100" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="25" y="510" width="80" height="80" fill="#e0e0e0"/>
  <text x="115" y="525" font-size="11" fill="#333" font-weight="bold">Licuadora Oster 600W</text>
  <text x="115" y="542" font-size="9" fill="#666">3 velocidades, vaso vidrio</text>
  <text x="115" y="560" font-size="12" fill="#4a90e2" font-weight="bold">$159.000</text>
  <rect x="115" y="568" width="90" height="24" rx="4" fill="#4a90e2"/>
  <text x="130" y="584" font-size="9" fill="white">+ Carrito</text>

  <!-- CATALOGO GENERAL -->
  <text x="15" y="630" font-size="12" fill="#333" font-weight="bold">CATALOGO</text>
  <rect x="15" y="640" width="165" height="150" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="25" y="650" width="145" height="90" fill="#e0e0e0"/>
  <text x="25" y="755" font-size="9" fill="#333">Estufa Haceb 4 puestos</text>
  <text x="25" y="772" font-size="10" fill="#4a90e2" font-weight="bold">$720.000</text>

  <rect x="195" y="640" width="165" height="150" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="205" y="650" width="145" height="90" fill="#e0e0e0"/>
  <text x="205" y="755" font-size="9" fill="#333">Aire Acond. LG 12000BTU</text>
  <text x="205" y="772" font-size="10" fill="#4a90e2" font-weight="bold">$1.680.000</text>

  <!-- NAVBAR INFERIOR (fijo): Home, Favoritos, Carrito, Pedidos, Perfil -->
  <rect x="0" y="830" width="375" height="70" fill="#4a90e2"/>

  <path d="M 45 848 L 37 856 L 37 864 L 53 864 L 53 856 Z" fill="none" stroke="white" stroke-width="2"/>
  <text x="33" y="882" font-size="9" fill="white">Home</text>

  <path d="M 120 848 L 113 862 L 127 862 Z" fill="none" stroke="white" stroke-width="1.5"/>
  <text x="97" y="882" font-size="9" fill="white">Favoritos</text>

  <path d="M 185 850 L 200 850 L 198 862 L 187 862 Z" fill="none" stroke="white" stroke-width="2"/>
  <text x="177" y="882" font-size="9" fill="white">Carrito</text>

  <rect x="258" y="848" width="14" height="16" fill="none" stroke="white" stroke-width="2"/>
  <text x="250" y="882" font-size="9" fill="white">Pedidos</text>

  <circle cx="335" cy="855" r="9" fill="none" stroke="white" stroke-width="2"/>
  <text x="320" y="882" font-size="9" fill="white">Perfil</text>
  <text x="315" y="847" font-size="6" fill="white" font-style="italic">(login/usuario)</text>

</svg>
