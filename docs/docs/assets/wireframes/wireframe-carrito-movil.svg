<svg viewBox="0 0 375 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="375" height="900" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="375" height="50" fill="#4a90e2"/>
  <text x="15" y="32" fill="white" font-size="16">&#8592;</text>
  <text x="45" y="32" fill="white" font-size="13">Mi carrito (3)</text>

  <!-- PRODUCTO 1 -->
  <rect x="15" y="70" width="345" height="120" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="25" y="80" width="80" height="80" fill="#e0e0e0"/>
  <text x="115" y="95" font-size="11" fill="#333" font-weight="bold">Microondas Whirlpool 20L</text>
  <text x="115" y="112" font-size="9" fill="#666">Precio unitario: $389.000</text>

  <!-- controles cantidad -->
  <rect x="115" y="125" width="90" height="28" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="126" y="145" font-size="14" fill="#333">-</text>
  <text x="155" y="144" font-size="12" fill="#333">1</text>
  <text x="185" y="145" font-size="14" fill="#333">+</text>

  <text x="115" y="175" font-size="11" fill="#4a90e2" font-weight="bold">Subtotal: $389.000</text>
  <text x="330" y="90" font-size="12" fill="#e74c3c">&#10005;</text>

  <!-- PRODUCTO 2 -->
  <rect x="15" y="200" width="345" height="120" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="25" y="210" width="80" height="80" fill="#e0e0e0"/>
  <text x="115" y="225" font-size="11" fill="#333" font-weight="bold">Licuadora Oster 600W</text>
  <text x="115" y="242" font-size="9" fill="#666">Precio unitario: $159.000</text>

  <rect x="115" y="255" width="90" height="28" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="126" y="275" font-size="14" fill="#333">-</text>
  <text x="155" y="274" font-size="12" fill="#333">2</text>
  <text x="185" y="275" font-size="14" fill="#333">+</text>

  <text x="115" y="305" font-size="11" fill="#4a90e2" font-weight="bold">Subtotal: $318.000</text>
  <text x="330" y="220" font-size="12" fill="#e74c3c">&#10005;</text>

  <!-- PRODUCTO 3 -->
  <rect x="15" y="330" width="345" height="120" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="25" y="340" width="80" height="80" fill="#e0e0e0"/>
  <text x="115" y="355" font-size="11" fill="#333" font-weight="bold">Estufa Haceb 4 puestos</text>
  <text x="115" y="372" font-size="9" fill="#666">Precio unitario: $720.000</text>

  <rect x="115" y="385" width="90" height="28" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="126" y="405" font-size="14" fill="#333">-</text>
  <text x="155" y="404" font-size="12" fill="#333">1</text>
  <text x="185" y="405" font-size="14" fill="#333">+</text>

  <text x="115" y="435" font-size="11" fill="#4a90e2" font-weight="bold">Subtotal: $720.000</text>
  <text x="330" y="350" font-size="12" fill="#e74c3c">&#10005;</text>

  <text x="15" y="480" font-size="9" fill="#ccc" font-style="italic">(el usuario puede seguir scrolleando si hay mas productos...)</text>

  <!-- ESTADO VACIO (nota de referencia, no forma parte del scroll normal) -->
  <text x="15" y="510" font-size="8" fill="#bbb" font-style="italic">Nota: si el carrito esta vacio, mostrar mensaje "Tu carrito esta vacio" + boton "Ir al catalogo"</text>

  <!-- RESUMEN STICKY -->
  <rect x="0" y="770" width="375" height="130" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="15" y="795" font-size="10" fill="#666">Subtotal (4 productos)</text>
  <text x="300" y="795" font-size="10" fill="#666">$1.427.000</text>
  <text x="15" y="812" font-size="10" fill="#666">Envio</text>
  <text x="300" y="812" font-size="10" fill="#666">Calculado en checkout</text>
  <line x1="15" y1="820" x2="360" y2="820" stroke="#eee"/>
  <text x="15" y="840" font-size="13" fill="#333" font-weight="bold">Total</text>
  <text x="280" y="840" font-size="14" fill="#4a90e2" font-weight="bold">$1.427.000</text>

  <rect x="15" y="850" width="345" height="38" rx="6" fill="#4a90e2"/>
  <text x="150" y="874" font-size="12" fill="white" font-weight="bold">Confirmar y continuar</text>

  <text x="15" y="768" font-size="7" fill="#bbb" font-style="italic">^ Resumen fijo (sticky), siempre visible</text>

</svg>
