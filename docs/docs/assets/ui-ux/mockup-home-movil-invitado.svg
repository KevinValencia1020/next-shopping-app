  <path d="M 185 900 L 200 900 L 198 912 L 187 912 Z" fill="none" stroke="#ccc" stroke-width="2"/>
  <text x="177" y="932" font-size="9" fill="#ccc">Carrito</text>

  <rect x="258" y="898" width="14" height="16" fill="none" stroke="#555" stroke-width="2"/>
  <text x="250" y="932" font-size="9" fill="#555">Pedidos</text>

  <!-- icono Perfil en estado "sin sesion" (silueta vacia, distinta al estado logueado) -->
  <circle cx="335" cy="905" r="9" fill="none" stroke="#00d9a3" stroke-width="2"/>
  <circle cx="335" cy="902" r="3" fill="none" stroke="#00d9a3" stroke-width="1.5"/>
  <path d="M 330 909 Q 335 905 340 909" fill="none" stroke="#00d9a3" stroke-width="1.5"/>
  <text x="325" y="932" font-size="9" fill="#00d9a3" font-weight="bold">Entrar</text>

  <text x="15" y="878" font-size="7" fill="#999" font-style="italic">^ "Perfil" se muestra como "Entrar" cuando no hay sesion activa</text>

