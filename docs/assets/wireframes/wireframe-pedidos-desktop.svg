  <rect x="410" y="365" width="70" height="70" fill="#e0e0e0"/>
  <text x="495" y="380" font-size="10" fill="#333" font-weight="bold">Microondas Whirlpool 20L</text>
  <text x="495" y="397" font-size="9" fill="#666">Cantidad: 1</text>
  <text x="900" y="385" font-size="11" fill="#4a90e2" font-weight="bold">$389.000</text>

  <rect x="410" y="445" width="70" height="70" fill="#e0e0e0"/>
