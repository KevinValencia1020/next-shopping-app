  <text x="410" y="175" font-size="10" fill="#999">Fecha del pedido: 12 jul 2026</text>

  <!-- linea de tiempo -->
  <circle cx="440" cy="215" r="11" fill="#4a90e2"/>
  <text x="435" y="219" font-size="10" fill="white">&#10003;</text>
  <line x1="451" y1="215" x2="570" y2="215" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="581" cy="215" r="11" fill="#4a90e2"/>
  <text x="576" y="219" font-size="10" fill="white">&#10003;</text>
  <line x1="592" y1="215" x2="711" y2="215" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="722" cy="215" r="11" fill="#4a90e2"/>
  <text x="717" y="219" font-size="10" fill="white">&#10003;</text>
  <line x1="733" y1="215" x2="852" y2="215" stroke="#ddd" stroke-width="2"/>
