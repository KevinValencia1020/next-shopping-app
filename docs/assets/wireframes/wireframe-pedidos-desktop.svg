<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="750" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="60" fill="#232f3e"/>
  <text x="25" y="37" fill="white" font-size="16" font-weight="bold">NEXT SHOPPING</text>
