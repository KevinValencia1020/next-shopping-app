  <text x="495" y="477" font-size="9" fill="#666">Cantidad: 2</text>
  <text x="900" y="465" font-size="11" fill="#4a90e2" font-weight="bold">$318.000</text>

  <rect x="410" y="525" width="70" height="70" fill="#e0e0e0"/>
  <text x="495" y="540" font-size="10" fill="#333" font-weight="bold">Estufa Haceb 4 puestos</text>
  <text x="495" y="557" font-size="9" fill="#666">Cantidad: 1</text>
  <text x="900" y="545" font-size="11" fill="#4a90e2" font-weight="bold">$720.000</text>

  <!-- resumen -->
  <line x1="410" y1="610" x2="1145" y2="610" stroke="#eee"/>
  <text x="410" y="632" font-size="10" fill="#666">Subtotal</text>
  <text x="1080" y="632" font-size="10" fill="#666">$1.427.000</text>
  <text x="410" y="650" font-size="10" fill="#666">Envio</text>
  <text x="1080" y="650" font-size="10" fill="#666">$25.000</text>
  <line x1="410" y1="662" x2="1145" y2="662" stroke="#ddd"/>
  <text x="410" y="685" font-size="14" fill="#333" font-weight="bold">Total pagado</text>
  <text x="1040" y="685" font-size="15" fill="#4a90e2" font-weight="bold">$1.452.000</text>

</svg>
