  <text x="40" y="375" font-size="11" fill="#4a90e2" font-weight="bold">$745.000</text>
  <rect x="40" y="382" width="90" height="18" rx="9" fill="#fcf8e3"/>
  <text x="48" y="395" font-size="8" fill="#8a6d3b" font-weight="bold">Confirmado</text>

  <text x="25" y="450" font-size="9" fill="#999">Selecciona un pedido para ver el detalle &#8594;</text>

  <!-- COLUMNA DERECHA: Detalle del pedido seleccionado -->
  <rect x="380" y="120" width="795" height="590" rx="6" fill="#f9f9f9" stroke="#ddd"/>

