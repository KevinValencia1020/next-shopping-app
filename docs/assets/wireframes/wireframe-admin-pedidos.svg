<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="850" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER ADMIN -->
  <rect x="0" y="0" width="1200" height="55" fill="#2c3e50"/>
  <text x="25" y="34" fill="white" font-size="15" font-weight="bold">NEXT SHOPPING - Panel Admin</text>
  <text x="1080" y="34" fill="white" font-size="10">Admin: Carlos R.</text>
  <text x="1150" y="34" fill="white" font-size="10">&#9660;</text>

  <!-- SIDEBAR ADMIN (fijo) -->
  <rect x="0" y="55" width="210" height="795" fill="#34495e"/>
  <text x="20" y="90" font-size="10" fill="#95a5a6" font-weight="bold">GESTION</text>

  <text x="25" y="128" font-size="11" fill="#ecf0f1">&#128230; Productos</text>
  <text x="25" y="170" font-size="11" fill="#ecf0f1">&#127991; Ofertas</text>

  <rect x="10" y="192" width="190" height="36" rx="4" fill="#4a90e2"/>
  <text x="25" y="215" font-size="11" fill="white" font-weight="bold">&#128230; Pedidos</text>

  <line x1="20" y1="240" x2="190" y2="240" stroke="#4a5f73"/>
  <text x="25" y="270" font-size="10" fill="#95a5a6">&#9881; Cerrar sesion</text>

  <!-- CONTENIDO -->
  <text x="235" y="95" font-size="20" fill="#333" font-weight="bold">Gestion de pedidos</text>
  <text x="235" y="118" font-size="10" fill="#999">Todos los pedidos de clientes</text>

  <!-- FILTROS -->
  <rect x="235" y="140" width="140" height="30" rx="4" fill="white" stroke="#ddd"/>
  <text x="245" y="160" font-size="9" fill="#666">Todos los estados &#9662;</text>
  <rect x="390" y="140" width="220" height="30" rx="4" fill="white" stroke="#ddd"/>
  <text x="400" y="160" font-size="9" fill="#999">Buscar por # de pedido...</text>

  <!-- TABLA DE PEDIDOS -->
  <rect x="235" y="185" width="925" height="36" fill="#f5f5f5"/>
  <text x="248" y="207" font-size="9" fill="#666" font-weight="bold">PEDIDO</text>
  <text x="330" y="207" font-size="9" fill="#666" font-weight="bold">CLIENTE</text>
  <text x="470" y="207" font-size="9" fill="#666" font-weight="bold">FECHA</text>
  <text x="580" y="207" font-size="9" fill="#666" font-weight="bold">TOTAL</text>
  <text x="680" y="207" font-size="9" fill="#666" font-weight="bold">ESTADO ACTUAL</text>
  <text x="850" y="207" font-size="9" fill="#666" font-weight="bold">ACTUALIZAR ESTADO</text>

  <!-- fila 1 -->
  <line x1="235" y1="221" x2="1160" y2="221" stroke="#eee"/>
  <text x="248" y="248" font-size="9" fill="#333">#00123</text>
  <text x="330" y="248" font-size="9" fill="#333">Kevin Zapata</text>
  <text x="470" y="248" font-size="9" fill="#333">12 jul 2026</text>
  <text x="580" y="248" font-size="9" fill="#333">$1.452.000</text>
  <rect x="680" y="233" width="75" height="20" rx="10" fill="#dff0d8"/>
  <text x="690" y="247" font-size="8" fill="#3c763d" font-weight="bold">Entregado</text>
  <rect x="850" y="233" width="160" height="26" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="860" y="250" font-size="8" fill="#999">(sin cambios disponibles)</text>

  <!-- fila 2 -->
  <line x1="235" y1="265" x2="1160" y2="265" stroke="#eee"/>
  <text x="248" y="292" font-size="9" fill="#333">#00119</text>
  <text x="330" y="292" font-size="9" fill="#333">Laura Gomez</text>
  <text x="470" y="292" font-size="9" fill="#333">8 jul 2026</text>
  <text x="580" y="292" font-size="9" fill="#333">$2.450.000</text>
  <rect x="680" y="277" width="60" height="20" rx="10" fill="#d9edf7"/>
  <text x="688" y="291" font-size="8" fill="#31708f" font-weight="bold">Enviado</text>
  <rect x="850" y="277" width="160" height="26" rx="4" fill="white" stroke="#4a90e2"/>
  <text x="860" y="294" font-size="8" fill="#4a90e2">Marcar como Entregado &#9662;</text>

  <!-- fila 3 -->
  <line x1="235" y1="309" x2="1160" y2="309" stroke="#eee"/>
  <text x="248" y="336" font-size="9" fill="#333">#00115</text>
  <text x="330" y="336" font-size="9" fill="#333">Andres Ruiz</text>
  <text x="470" y="336" font-size="9" fill="#333">2 jul 2026</text>
  <text x="580" y="336" font-size="9" fill="#333">$745.000</text>
  <rect x="680" y="321" width="90" height="20" rx="10" fill="#fcf8e3"/>
  <text x="688" y="335" font-size="8" fill="#8a6d3b" font-weight="bold">Confirmado</text>
  <rect x="850" y="321" width="160" height="26" rx="4" fill="white" stroke="#4a90e2"/>
  <text x="860" y="338" font-size="8" fill="#4a90e2">Marcar como Enviado &#9662;</text>

  <!-- fila 4 -->
  <line x1="235" y1="353" x2="1160" y2="353" stroke="#eee"/>
  <text x="248" y="380" font-size="9" fill="#333">#00110</text>
  <text x="330" y="380" font-size="9" fill="#333">Maria Torres</text>
  <text x="470" y="380" font-size="9" fill="#333">28 jun 2026</text>
  <text x="580" y="380" font-size="9" fill="#333">$389.000</text>
  <rect x="680" y="365" width="90" height="20" rx="10" fill="#fcf8e3"/>
  <text x="688" y="379" font-size="8" fill="#8a6d3b" font-weight="bold">Pendiente</text>
  <rect x="850" y="365" width="160" height="26" rx="4" fill="white" stroke="#4a90e2"/>
  <text x="860" y="382" font-size="8" fill="#4a90e2">Marcar como Confirmado &#9662;</text>

  <line x1="235" y1="397" x2="1160" y2="397" stroke="#eee"/>

  <!-- NOTA: secuencia valida -->
  <rect x="235" y="420" width="700" height="55" rx="6" fill="#fdf2f2" stroke="#f8cecc" stroke-dasharray="3,3"/>
  <text x="250" y="440" font-size="9" fill="#b85450" font-weight="bold">Regla de secuencia:</text>
  <text x="250" y="455" font-size="9" fill="#b85450">Solo se puede avanzar al siguiente estado en orden (Pendiente &#8594; Confirmado &#8594; Enviado &#8594; Entregado).</text>
  <text x="250" y="468" font-size="9" fill="#b85450">No se puede saltar pasos ni retroceder.</text>

</svg>
