<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="850" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER simple -->
  <rect x="0" y="0" width="1200" height="60" fill="#232f3e"/>
  <text x="25" y="37" fill="white" font-size="16" font-weight="bold">NEXT SHOPPING</text>
  <text x="1080" y="37" fill="white" font-size="12" font-weight="bold">Checkout</text>

  <text x="25" y="100" font-size="20" fill="#333" font-weight="bold">Finalizar compra</text>

  <!-- COLUMNA IZQUIERDA: Direccion + Pago -->

  <!-- 1. DIRECCION -->
  <text x="25" y="140" font-size="14" fill="#333" font-weight="bold">1. Direccion de envio</text>
  <rect x="25" y="150" width="700" height="90" rx="6" fill="#f5f5f5" stroke="#4a90e2" stroke-width="2"/>
  <text x="40" y="175" font-size="11" fill="#333" font-weight="bold">Casa</text>
  <text x="40" y="193" font-size="10" fill="#666">Calle 45 #12-30, Barrio Centro</text>
  <text x="40" y="209" font-size="10" fill="#666">Cali, Valle del Cauca</text>
  <text x="650" y="175" font-size="10" fill="#4a90e2">Cambiar</text>

  <rect x="25" y="255" width="170" height="30" rx="4" fill="white" stroke="#4a90e2"/>
  <text x="40" y="275" font-size="10" fill="#4a90e2">+ Agregar direccion</text>

  <!-- 2. METODO DE PAGO -->
  <text x="25" y="320" font-size="14" fill="#333" font-weight="bold">2. Metodo de pago</text>

  <rect x="25" y="330" width="335" height="60" rx="6" fill="#f5f5f5" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="45" cy="360" r="8" fill="none" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="45" cy="360" r="3" fill="#4a90e2"/>
  <text x="65" y="355" font-size="11" fill="#333" font-weight="bold">Tarjeta terminada en 4521</text>
  <text x="65" y="372" font-size="9" fill="#666">Visa</text>

  <rect x="390" y="330" width="335" height="60" rx="6" fill="#ffffff" stroke="#ddd"/>
  <circle cx="410" cy="360" r="8" fill="none" stroke="#999" stroke-width="2"/>
  <text x="430" y="365" font-size="11" fill="#333">PSE</text>

  <rect x="25" y="405" width="190" height="30" rx="4" fill="white" stroke="#4a90e2"/>
  <text x="40" y="425" font-size="10" fill="#4a90e2">+ Agregar metodo de pago</text>

  <!-- NOTA: manejo de error de pago -->
  <rect x="25" y="460" width="700" height="55" rx="6" fill="#fdf2f2" stroke="#f8cecc" stroke-dasharray="3,3"/>
  <text x="40" y="480" font-size="9" fill="#b85450" font-weight="bold">Si el pago falla:</text>
  <text x="40" y="495" font-size="9" fill="#b85450">Se muestra mensaje de error aqui mismo y se permite reintentar sin perder los datos ya ingresados</text>

  <text x="25" y="550" font-size="10" fill="#4a90e2">&#8592; Volver al carrito</text>

  <!-- COLUMNA DERECHA: Resumen (fijo, visible sin scroll) -->
  <rect x="760" y="140" width="415" height="420" rx="6" fill="#f9f9f9" stroke="#ddd"/>
  <text x="785" y="170" font-size="15" fill="#333" font-weight="bold">Resumen del pedido</text>

  <text x="785" y="205" font-size="10" fill="#666">Microondas Whirlpool 20L x1</text>
  <text x="1080" y="205" font-size="10" fill="#666">$389.000</text>

  <text x="785" y="228" font-size="10" fill="#666">Licuadora Oster 600W x2</text>
  <text x="1080" y="228" font-size="10" fill="#666">$318.000</text>

  <text x="785" y="251" font-size="10" fill="#666">Estufa Haceb 4 puestos x1</text>
  <text x="1080" y="251" font-size="10" fill="#666">$720.000</text>

  <line x1="785" y1="270" x2="1145" y2="270" stroke="#eee"/>

  <text x="785" y="295" font-size="11" fill="#666">Subtotal</text>
  <text x="1080" y="295" font-size="11" fill="#666">$1.427.000</text>
  <text x="785" y="315" font-size="11" fill="#666">Envio</text>
  <text x="1080" y="315" font-size="11" fill="#666">$25.000</text>

  <line x1="785" y1="335" x2="1145" y2="335" stroke="#ddd"/>

  <text x="785" y="365" font-size="16" fill="#333" font-weight="bold">Total</text>
  <text x="1050" y="365" font-size="17" fill="#4a90e2" font-weight="bold">$1.452.000</text>

  <rect x="785" y="395" width="360" height="45" rx="6" fill="#4a90e2"/>
  <text x="890" y="423" font-size="13" fill="white" font-weight="bold">Confirmar pedido</text>

  <text x="785" y="470" font-size="9" fill="#999">Este resumen permanece visible sin</text>
  <text x="785" y="484" font-size="9" fill="#999">necesidad de scroll (columna fija).</text>

</svg>
