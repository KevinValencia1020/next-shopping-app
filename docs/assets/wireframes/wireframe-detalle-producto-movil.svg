<svg viewBox="0 0 375 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="375" height="1000" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER simple con volver -->
  <rect x="0" y="0" width="375" height="50" fill="#4a90e2"/>
  <text x="15" y="32" fill="white" font-size="16">&#8592;</text>
  <text x="45" y="32" fill="white" font-size="13">Detalle de producto</text>
  <circle cx="345" cy="25" r="9" fill="none" stroke="white" stroke-width="2"/>
  <!-- icono favorito (corazon simplificado) -->

  <!-- CARRUSEL DE IMAGENES -->
  <rect x="0" y="50" width="375" height="280" fill="#e8e8e8"/>
  <rect x="140" y="170" width="95" height="40" fill="none"/>
  <text x="160" y="195" font-size="11" fill="#999">[ Imagen producto ]</text>
  <!-- dots indicador carrusel -->
  <circle cx="167" cy="315" r="3" fill="#4a90e2"/>
  <circle cx="180" cy="315" r="3" fill="#ccc"/>
  <circle cx="193" cy="315" r="3" fill="#ccc"/>
  <circle cx="206" cy="315" r="3" fill="#ccc"/>
  <text x="10" y="70" font-size="8" fill="#999">&#8592; desliza &#8594;</text>

  <!-- boton favorito flotante sobre imagen -->
  <circle cx="345" cy="70" r="16" fill="white" opacity="0.9"/>
  <text x="337" y="75" font-size="14">&#9825;</text>

  <!-- INFO DEL PRODUCTO -->
  <text x="15" y="355" font-size="15" fill="#333" font-weight="bold">Microondas Whirlpool 20L</text>

  <!-- Rating visible de inmediato -->
  <text x="15" y="375" font-size="12" fill="#f5a623">&#9733;&#9733;&#9733;&#9733;&#9734;</text>
  <text x="90" y="375" font-size="10" fill="#666">4.2 (128 opiniones)</text>

  <text x="15" y="405" font-size="18" fill="#4a90e2" font-weight="bold">$389.000</text>
  <text x="105" y="405" font-size="11" fill="#999" text-decoration="line-through">$450.000</text>
  <rect x="160" y="392" width="55" height="18" rx="3" fill="#e74c3c"/>
  <text x="167" y="405" font-size="9" fill="white">-14% OFF</text>

  <!-- Descripcion -->
  <text x="15" y="435" font-size="11" fill="#333" font-weight="bold">Descripcion</text>
  <text x="15" y="452" font-size="9" fill="#666">Microondas digital de 20 litros, panel</text>
  <text x="15" y="465" font-size="9" fill="#666">tactil, 700W de potencia, 6 niveles</text>
  <text x="15" y="478" font-size="9" fill="#666">de coccion.</text>

  <!-- Especificaciones -->
  <text x="15" y="505" font-size="11" fill="#333" font-weight="bold">Especificaciones</text>
  <rect x="15" y="515" width="345" height="90" rx="4" fill="#f9f9f9" stroke="#eee"/>
  <text x="25" y="533" font-size="9" fill="#666">Capacidad: 20 litros</text>
  <text x="25" y="550" font-size="9" fill="#666">Potencia: 700W</text>
  <text x="25" y="567" font-size="9" fill="#666">Marca: Whirlpool</text>
  <text x="25" y="584" font-size="9" fill="#666">Stock disponible: 12 unidades</text>

  <!-- Cantidad -->
  <text x="15" y="630" font-size="11" fill="#333" font-weight="bold">Cantidad</text>
  <rect x="15" y="640" width="100" height="30" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="25" y="660" font-size="14" fill="#333">-</text>
  <text x="60" y="660" font-size="12" fill="#333">1</text>
  <text x="95" y="660" font-size="14" fill="#333">+</text>

  <!-- SECCION PRODUCTOS SIMILARES -->
  <line x1="15" y1="690" x2="360" y2="690" stroke="#eee"/>
  <text x="15" y="712" font-size="12" fill="#333" font-weight="bold">PRODUCTOS SIMILARES</text>
  <text x="15" y="725" font-size="8" fill="#999">Desliza para ver mas &#8594;</text>

  <rect x="15" y="735" width="110" height="130" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="23" y="743" width="94" height="75" fill="#e0e0e0"/>
  <text x="23" y="830" font-size="9" fill="#333">Microondas Samsung 23L</text>
  <text x="23" y="845" font-size="10" fill="#4a90e2" font-weight="bold">$425.000</text>

  <rect x="130" y="735" width="110" height="130" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="138" y="743" width="94" height="75" fill="#e0e0e0"/>
  <text x="138" y="830" font-size="9" fill="#333">Microondas LG 21L</text>
  <text x="138" y="845" font-size="10" fill="#4a90e2" font-weight="bold">$399.000</text>

  <rect x="245" y="735" width="110" height="130" rx="6" fill="#f5f5f5" stroke="#ddd" opacity="0.6"/>

  <!-- BOTON STICKY -->
  <rect x="0" y="930" width="375" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <rect x="15" y="945" width="345" height="40" rx="6" fill="#4a90e2"/>
  <text x="150" y="970" font-size="13" fill="white" font-weight="bold">Agregar al carrito</text>
  <text x="15" y="928" font-size="7" fill="#bbb" font-style="italic">^ Boton fijo (sticky), siempre visible sin importar el scroll</text>

</svg>
