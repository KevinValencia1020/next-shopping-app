<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff" stroke="#ccc"/>

  <!-- HEADER simple -->
  <rect x="0" y="0" width="1200" height="60" fill="#232f3e"/>
  <text x="25" y="37" fill="white" font-size="16" font-weight="bold">NEXT SHOPPING</text>
  <text x="1080" y="37" fill="white" font-size="12" font-weight="bold">Carrito</text>

  <text x="25" y="100" font-size="20" fill="#333" font-weight="bold">Mi carrito (3 productos)</text>

  <!-- COLUMNA IZQUIERDA: Lista de productos -->
  <rect x="25" y="120" width="700" height="130" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="40" y="135" width="100" height="100" fill="#e0e0e0"/>
  <text x="160" y="155" font-size="13" fill="#333" font-weight="bold">Microondas Whirlpool 20L</text>
  <text x="160" y="175" font-size="10" fill="#666">Precio unitario: $389.000</text>

  <rect x="160" y="195" width="100" height="30" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="173" y="216" font-size="15" fill="#333">-</text>
  <text x="205" y="215" font-size="13" fill="#333">1</text>
  <text x="238" y="216" font-size="15" fill="#333">+</text>

  <text x="500" y="160" font-size="13" fill="#4a90e2" font-weight="bold">$389.000</text>
  <text x="650" y="150" font-size="13" fill="#e74c3c">&#10005; Eliminar</text>

  <rect x="25" y="265" width="700" height="130" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="40" y="280" width="100" height="100" fill="#e0e0e0"/>
  <text x="160" y="300" font-size="13" fill="#333" font-weight="bold">Licuadora Oster 600W</text>
  <text x="160" y="320" font-size="10" fill="#666">Precio unitario: $159.000</text>

  <rect x="160" y="340" width="100" height="30" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="173" y="361" font-size="15" fill="#333">-</text>
  <text x="205" y="360" font-size="13" fill="#333">2</text>
  <text x="238" y="361" font-size="15" fill="#333">+</text>

  <text x="500" y="305" font-size="13" fill="#4a90e2" font-weight="bold">$318.000</text>
  <text x="650" y="295" font-size="13" fill="#e74c3c">&#10005; Eliminar</text>

  <rect x="25" y="410" width="700" height="130" rx="6" fill="#ffffff" stroke="#ddd"/>
  <rect x="40" y="425" width="100" height="100" fill="#e0e0e0"/>
  <text x="160" y="445" font-size="13" fill="#333" font-weight="bold">Estufa Haceb 4 puestos</text>
  <text x="160" y="465" font-size="10" fill="#666">Precio unitario: $720.000</text>

  <rect x="160" y="485" width="100" height="30" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="173" y="506" font-size="15" fill="#333">-</text>
  <text x="205" y="505" font-size="13" fill="#333">1</text>
  <text x="238" y="506" font-size="15" fill="#333">+</text>

  <text x="500" y="450" font-size="13" fill="#4a90e2" font-weight="bold">$720.000</text>
  <text x="650" y="440" font-size="13" fill="#e74c3c">&#10005; Eliminar</text>

  <text x="25" y="580" font-size="10" fill="#4a90e2">&#8592; Seguir comprando</text>

  <!-- COLUMNA DERECHA: Resumen (fijo, visible sin scroll) -->
  <rect x="760" y="120" width="415" height="280" rx="6" fill="#f9f9f9" stroke="#ddd"/>
  <text x="785" y="150" font-size="15" fill="#333" font-weight="bold">Resumen del pedido</text>

  <text x="785" y="185" font-size="11" fill="#666">Subtotal (4 productos)</text>
  <text x="1080" y="185" font-size="11" fill="#666">$1.427.000</text>

  <text x="785" y="210" font-size="11" fill="#666">Envio</text>
  <text x="1000" y="210" font-size="11" fill="#666">Calculado en checkout</text>

  <line x1="785" y1="230" x2="1145" y2="230" stroke="#ddd"/>

  <text x="785" y="260" font-size="15" fill="#333" font-weight="bold">Total</text>
  <text x="1050" y="260" font-size="16" fill="#4a90e2" font-weight="bold">$1.427.000</text>

  <rect x="785" y="285" width="360" height="45" rx="6" fill="#4a90e2"/>
  <text x="900" y="313" font-size="13" fill="white" font-weight="bold">Confirmar y continuar</text>

  <text x="785" y="360" font-size="9" fill="#999">Este resumen permanece visible sin</text>
  <text x="785" y="374" font-size="9" fill="#999">necesidad de scroll (columna fija).</text>

</svg>
