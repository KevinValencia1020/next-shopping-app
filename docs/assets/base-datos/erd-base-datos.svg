<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1400" height="1100" fill="#ffffff"/>
  <text x="30" y="35" font-size="18" fill="#1e1b3a" font-weight="bold">Diagrama Entidad-Relacion - next-shopping</text>

  <!-- USUARIOS -->
  <rect x="30" y="70" width="220" height="200" rx="6" fill="#eeeefb" stroke="#5b5fef" stroke-width="2"/>
  <rect x="30" y="70" width="220" height="30" fill="#5b5fef"/>
  <text x="45" y="90" font-size="12" fill="white" font-weight="bold">usuarios</text>
  <text x="45" y="115" font-size="9" fill="#333">PK  id</text>
  <text x="45" y="130" font-size="9" fill="#333">nombre</text>
  <text x="45" y="145" font-size="9" fill="#333">correo (unique)</text>
  <text x="45" y="160" font-size="9" fill="#333">password_hash</text>
  <text x="45" y="175" font-size="9" fill="#333">rol (cliente / admin)</text>
  <text x="45" y="190" font-size="9" fill="#333">intentos_fallidos</text>
  <text x="45" y="205" font-size="9" fill="#333">bloqueado_hasta</text>
  <text x="45" y="220" font-size="9" fill="#333">creado_en</text>

  <!-- DIRECCIONES -->
  <rect x="30" y="310" width="220" height="140" rx="6" fill="#eeeefb" stroke="#5b5fef" stroke-width="2"/>
  <rect x="30" y="310" width="220" height="30" fill="#5b5fef"/>
  <text x="45" y="330" font-size="12" fill="white" font-weight="bold">direcciones</text>
  <text x="45" y="355" font-size="9" fill="#333">PK  id</text>
  <text x="45" y="370" font-size="9" fill="#333">FK  usuario_id</text>
  <text x="45" y="385" font-size="9" fill="#333">etiqueta (Casa, Trabajo)</text>
  <text x="45" y="400" font-size="9" fill="#333">direccion_completa</text>
  <text x="45" y="415" font-size="9" fill="#333">ciudad</text>
  <text x="45" y="430" font-size="9" fill="#333">es_predeterminada</text>

  <!-- FAVORITOS -->
  <rect x="30" y="480" width="220" height="110" rx="6" fill="#eeeefb" stroke="#5b5fef" stroke-width="2"/>
  <rect x="30" y="480" width="220" height="30" fill="#5b5fef"/>
  <text x="45" y="500" font-size="12" fill="white" font-weight="bold">favoritos</text>
  <text x="45" y="525" font-size="9" fill="#333">PK  id</text>
  <text x="45" y="540" font-size="9" fill="#333">FK  usuario_id</text>
  <text x="45" y="555" font-size="9" fill="#333">FK  producto_id</text>
  <text x="45" y="570" font-size="9" fill="#333">creado_en</text>

  <!-- BUSQUEDAS RECIENTES -->
  <rect x="30" y="620" width="220" height="110" rx="6" fill="#eeeefb" stroke="#5b5fef" stroke-width="2"/>
  <rect x="30" y="620" width="220" height="30" fill="#5b5fef"/>
  <text x="45" y="640" font-size="12" fill="white" font-weight="bold">busquedas_recientes</text>
  <text x="45" y="665" font-size="9" fill="#333">PK  id</text>
  <text x="45" y="680" font-size="9" fill="#333">FK  usuario_id</text>
  <text x="45" y="695" font-size="9" fill="#333">termino_buscado</text>
  <text x="45" y="710" font-size="9" fill="#333">creado_en</text>

  <!-- CATEGORIAS -->
  <rect x="330" y="70" width="200" height="110" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <rect x="330" y="70" width="200" height="30" fill="#4caf50"/>
  <text x="345" y="90" font-size="12" fill="white" font-weight="bold">categorias</text>
  <text x="345" y="115" font-size="9" fill="#333">PK  id</text>
  <text x="345" y="130" font-size="9" fill="#333">nombre</text>
  <text x="345" y="145" font-size="9" fill="#333">slug</text>

  <!-- PRODUCTOS -->
  <rect x="330" y="220" width="240" height="280" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <rect x="330" y="220" width="240" height="30" fill="#4caf50"/>
  <text x="345" y="240" font-size="12" fill="white" font-weight="bold">productos</text>
  <text x="345" y="265" font-size="9" fill="#333">PK  id</text>
  <text x="345" y="280" font-size="9" fill="#333">nombre</text>
  <text x="345" y="295" font-size="9" fill="#333">descripcion</text>
  <text x="345" y="310" font-size="9" fill="#333">marca</text>
  <text x="345" y="325" font-size="9" fill="#333">precio</text>
  <text x="345" y="340" font-size="9" fill="#333">stock</text>
  <text x="345" y="355" font-size="9" fill="#333">FK  categoria_id</text>
  <text x="345" y="370" font-size="9" fill="#333">caracteristicas (JSON)</text>
  <text x="345" y="385" font-size="9" fill="#333">imagen_principal_url</text>
  <text x="345" y="400" font-size="9" fill="#333">imagenes_urls (array)</text>
  <text x="345" y="415" font-size="9" fill="#333">activo</text>
  <text x="345" y="430" font-size="9" fill="#333">creado_en</text>
  <text x="345" y="445" font-size="9" fill="#333">actualizado_en</text>

  <!-- OFERTAS -->
  <rect x="330" y="540" width="240" height="180" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <rect x="330" y="540" width="240" height="30" fill="#4caf50"/>
  <text x="345" y="560" font-size="12" fill="white" font-weight="bold">ofertas</text>
  <text x="345" y="585" font-size="9" fill="#333">PK  id</text>
  <text x="345" y="600" font-size="9" fill="#333">tipo (producto / categoria)</text>
  <text x="345" y="615" font-size="9" fill="#333">FK  producto_id (nullable)</text>
  <text x="345" y="630" font-size="9" fill="#333">FK  categoria_id (nullable)</text>
  <text x="345" y="645" font-size="9" fill="#333">tipo_descuento (% / monto)</text>
  <text x="345" y="660" font-size="9" fill="#333">valor_descuento</text>
  <text x="345" y="675" font-size="9" fill="#333">fecha_inicio</text>
  <text x="345" y="690" font-size="9" fill="#333">fecha_vencimiento</text>

  <!-- CARRITOS -->
  <rect x="650" y="70" width="220" height="110" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <rect x="650" y="70" width="220" height="30" fill="#ff9800"/>
  <text x="665" y="90" font-size="12" fill="white" font-weight="bold">carritos</text>
  <text x="665" y="115" font-size="9" fill="#333">PK  id</text>
  <text x="665" y="130" font-size="9" fill="#333">FK  usuario_id (unique)</text>
  <text x="665" y="145" font-size="9" fill="#333">actualizado_en</text>

  <!-- CARRITO ITEMS -->
  <rect x="650" y="220" width="220" height="140" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <rect x="650" y="220" width="220" height="30" fill="#ff9800"/>
  <text x="665" y="240" font-size="12" fill="white" font-weight="bold">carrito_items</text>
  <text x="665" y="265" font-size="9" fill="#333">PK  id</text>
  <text x="665" y="280" font-size="9" fill="#333">FK  carrito_id</text>
  <text x="665" y="295" font-size="9" fill="#333">FK  producto_id</text>
  <text x="665" y="310" font-size="9" fill="#333">cantidad</text>
  <text x="665" y="325" font-size="9" fill="#333">agregado_en</text>

  <!-- PEDIDOS -->
  <rect x="650" y="400" width="240" height="240" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <rect x="650" y="400" width="240" height="30" fill="#e91e63"/>
  <text x="665" y="420" font-size="12" fill="white" font-weight="bold">pedidos</text>
  <text x="665" y="445" font-size="9" fill="#333">PK  id</text>
  <text x="665" y="460" font-size="9" fill="#333">FK  usuario_id</text>
  <text x="665" y="475" font-size="9" fill="#333">FK  direccion_id</text>
  <text x="665" y="490" font-size="9" fill="#333">estado (pendiente/confirmado/</text>
  <text x="665" y="503" font-size="9" fill="#333">        enviado/entregado)</text>
  <text x="665" y="518" font-size="9" fill="#333">subtotal</text>
  <text x="665" y="533" font-size="9" fill="#333">costo_envio</text>
  <text x="665" y="548" font-size="9" fill="#333">total</text>
  <text x="665" y="563" font-size="9" fill="#333">metodo_pago</text>
  <text x="665" y="578" font-size="9" fill="#333">creado_en</text>
  <text x="665" y="593" font-size="9" fill="#333">actualizado_en</text>

  <!-- PEDIDO ITEMS -->
  <rect x="650" y="680" width="240" height="150" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <rect x="650" y="680" width="240" height="30" fill="#e91e63"/>
  <text x="665" y="700" font-size="12" fill="white" font-weight="bold">pedido_items</text>
  <text x="665" y="725" font-size="9" fill="#333">PK  id</text>
  <text x="665" y="740" font-size="9" fill="#333">FK  pedido_id</text>
  <text x="665" y="755" font-size="9" fill="#333">FK  producto_id</text>
  <text x="665" y="770" font-size="9" fill="#333">cantidad</text>
  <text x="665" y="785" font-size="9" fill="#333">precio_unitario (historico)</text>

  <!-- RELACIONES (lineas) -->
  <!-- usuarios -> direcciones -->
  <line x1="250" y1="170" x2="330" y2="380" stroke="#999" stroke-width="1.5"/>
  <!-- usuarios -> favoritos -->
  <line x1="140" y1="270" x2="140" y2="480" stroke="#999" stroke-width="1.5"/>
  <!-- usuarios -> busquedas -->
  <line x1="140" y1="270" x2="140" y2="620" stroke="#999" stroke-width="1.5"/>
  <!-- categorias -> productos -->
  <line x1="430" y1="180" x2="430" y2="220" stroke="#999" stroke-width="1.5"/>
  <!-- productos -> favoritos -->
  <line x1="330" y1="480" x2="250" y2="540" stroke="#999" stroke-width="1.5"/>
  <!-- productos -> ofertas -->
  <line x1="450" y1="500" x2="450" y2="540" stroke="#999" stroke-width="1.5"/>
  <!-- usuarios -> carritos -->
  <line x1="250" y1="130" x2="650" y2="125" stroke="#999" stroke-width="1.5"/>
  <!-- carritos -> carrito_items -->
  <line x1="760" y1="180" x2="760" y2="220" stroke="#999" stroke-width="1.5"/>
  <!-- productos -> carrito_items -->
  <line x1="570" y1="300" x2="650" y2="290" stroke="#999" stroke-width="1.5"/>
  <!-- usuarios -> pedidos -->
  <line x1="250" y1="150" x2="650" y2="460" stroke="#999" stroke-width="1.5"/>
  <!-- direcciones -> pedidos -->
  <line x1="250" y1="400" x2="650" y2="470" stroke="#999" stroke-width="1.5"/>
  <!-- pedidos -> pedido_items -->
  <line x1="770" y1="640" x2="770" y2="680" stroke="#999" stroke-width="1.5"/>
  <!-- productos -> pedido_items -->
  <line x1="570" y1="440" x2="650" y2="750" stroke="#999" stroke-width="1.5"/>

  <!-- Leyenda -->
  <text x="950" y="90" font-size="10" fill="#666" font-weight="bold">Relaciones principales:</text>
  <text x="950" y="110" font-size="9" fill="#666">usuario 1 &#8594; N direcciones</text>
  <text x="950" y="125" font-size="9" fill="#666">usuario 1 &#8594; 1 carrito</text>
  <text x="950" y="140" font-size="9" fill="#666">usuario 1 &#8594; N pedidos</text>
  <text x="950" y="155" font-size="9" fill="#666">usuario 1 &#8594; N favoritos</text>
  <text x="950" y="170" font-size="9" fill="#666">categoria 1 &#8594; N productos</text>
  <text x="950" y="185" font-size="9" fill="#666">carrito 1 &#8594; N carrito_items</text>
  <text x="950" y="200" font-size="9" fill="#666">pedido 1 &#8594; N pedido_items</text>
  <text x="950" y="215" font-size="9" fill="#666">producto 1 &#8594; N ofertas</text>

</svg>
